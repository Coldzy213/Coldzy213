<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="150" viewBox="0 0 1100 150" role="img" aria-labelledby="title">
<title id="title">Code is language. Keep building.</title>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#06101E"/><stop offset="1" stop-color="#0B1D34"/></linearGradient>
  <linearGradient id="l" x1="0" x2="1"><stop stop-color="#2563EB"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
  <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12314A" stroke-width=".8"/></pattern>
  <style>
  text{font-family:'Consolas','DejaVu Sans Mono',monospace}
  .packet{stroke-dasharray:5 18;animation:d 3s linear infinite}
  .b{animation:blink 1s steps(1,end) infinite}
  @keyframes d{to{stroke-dashoffset:-46}}
  @keyframes blink{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1100" height="150" rx="14" fill="url(#bg)"/>
<rect width="1100" height="150" rx="14" fill="url(#g)"/>
<rect x="1" y="1" width="1098" height="148" rx="13" stroke="#1D5477" fill="none" stroke-width="2"/>
<path d="M35 71H265M835 71H1065" stroke="#255272" stroke-width="2" fill="none"/>
<path d="M35 71H265M835 71H1065" stroke="url(#l)" stroke-width="2" class="packet" fill="none"/>
<circle cx="38" cy="71" r="5" fill="#22D3EE"/>
<circle cx="1062" cy="71" r="5" fill="#22D3EE"/>
<text x="550" y="58" text-anchor="middle" font-size="25" font-weight="700" letter-spacing="1.2" fill="#E6F5FF">CODE IS LANGUAGE.</text>
<text x="550" y="86" text-anchor="middle" font-size="14" letter-spacing="3" fill="#64E3F4">BUILD  /  DEBUG  /  DEPLOY  /  REPEAT</text>
<text x="550" y="125" text-anchor="middle" font-size="11" letter-spacing="2" fill="#7290AA">CONNECTION ESTABLISHED  |  THANKS FOR VISITING</text>
<rect x="886" y="30" width="8" height="14" fill="#2BE2EA" class="b"/>
</svg>
