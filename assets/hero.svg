<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="376" viewBox="0 0 1100 376" role="img" aria-labelledby="title desc">
<title id="title">Raul Andrew Zamora — Developer Console</title>
<desc id="desc">Animated dark developer console banner with moving signal paths, pulsing radar, and a terminal-inspired profile.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050915"/><stop offset="0.58" stop-color="#091529"/><stop offset="1" stop-color="#071021"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
  <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.13"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#1A3551" stroke-opacity="0.45" stroke-width="0.8"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1098" height="374" x="1" y="1" rx="18"/></clipPath>
  <style>
    text { font-family: 'Consolas','DejaVu Sans Mono',monospace; }
    .muted { fill:#8CA8C6; }
    .cyan { fill:#5DE4F5; }
    .white { fill:#ECF6FF; }
    .blink { animation: blink 1.05s steps(1,end) infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .pulse2 { animation: pulse 2.2s ease-in-out -1s infinite; transform-origin: center; transform-box: fill-box; }
    .rotate { animation: rotate 14s linear infinite; transform-origin: center; transform-box: fill-box; }
    .flow { stroke-dasharray: 8 16; animation: dash 3s linear infinite; }
    .reveal1 { animation: reveal 8s steps(1,end) infinite; }
    .reveal2 { animation: reveal 8s steps(1,end) infinite; animation-delay: .3s; }
    .signal { animation: signal 3.4s ease-in-out infinite; }
    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes blink { 50%{opacity:0} }
    @keyframes pulse { 0%,100%{opacity:.75;transform:scale(.97)}50%{opacity:.18;transform:scale(1.1)} }
    @keyframes rotate { to{transform:rotate(360deg)} }
    @keyframes dash { to{stroke-dashoffset:-48} }
    @keyframes reveal { 0%,100%{opacity:1} }
    @keyframes signal { 0%,100%{opacity:.35}50%{opacity:1} }
    @keyframes sweep { 0%{transform:translateX(-130px)} 100%{transform:translateX(1120px)} }
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="1100" height="376" fill="url(#bg)"/>
  <rect width="1100" height="376" fill="url(#grid)" opacity=".72"/>
  <rect x="1" y="1" width="1098" height="374" rx="18" fill="none" stroke="#294764" stroke-width="2"/>
  <rect x="0" y="0" width="1100" height="4" fill="url(#accent)"/>
  <rect x="0" y="0" width="95" height="376" fill="url(#beam)" class="sweep"/>
  <g fill="none" stroke="#20628D" stroke-width="1.1" opacity=".65">
    <path d="M0 68H360L400 108H590"/><path d="M0 325H330L365 290H620"/><path d="M1099 78H1026L998 106H782"/>
  </g>
  <g fill="none" stroke="#3DE0F6" stroke-width="2" opacity=".9" class="flow"><path d="M0 68H360L400 108H590"/><path d="M0 325H330L365 290H620"/></g>
  <g>
    <circle cx="54" cy="36" r="5" fill="#22D3EE" class="signal"/>
    <text x="71" y="41" font-size="14" letter-spacing="2" fill="#A8CBDC">DEV://PROFILE</text>
    <text x="524" y="41" font-size="12" letter-spacing="1" fill="#748FA8">BUILD  /  LEARN  /  SHIP</text>
    <rect x="976" y="22" width="96" height="27" rx="5" fill="#0C2B2E" stroke="#1C8A90"/>
    <circle cx="990" cy="35" r="4" fill="#31E7C9" class="signal"/>
    <text x="1001" y="40" font-size="11" fill="#83F2D6" letter-spacing="1">ONLINE</text>
  </g>
  <text x="57" y="114" font-size="15" letter-spacing="3.6" fill="#5DE4F5">FULL-STACK ENGINEER</text>
  <text x="53" y="166" font-size="49" font-weight="700" letter-spacing="-1.7" fill="#EDF8FF">RAUL ANDREW</text>
  <text x="53" y="221" font-size="54" font-weight="700" letter-spacing="-1.5" fill="url(#accent)">ZAMORA</text>
  <rect x="285" y="180" width="13" height="43" fill="#39D9EF" class="blink"/>
  <text x="57" y="261" font-size="15" fill="#C8DFF1" letter-spacing="1">WEB SYSTEMS   /   MOBILE APPS   /   COMPUTER VISION</text>
  <rect x="55" y="286" width="569" height="1" fill="#264361"/>
  <text x="57" y="318" font-size="13" fill="#8BADCA">git@github:~$</text>
  <text x="207" y="318" font-size="13" fill="#E0F3FF">./build --ideas --into-products</text>
  <text x="57" y="346" font-size="12" fill="#52D7AF" class="signal">[OK] Developer environment initialized</text>
  <line x1="695" y1="64" x2="695" y2="342" stroke="#274461"/>
  <g transform="translate(901 188)">
    <circle r="111" fill="none" stroke="#1A415A" stroke-width="1"/>
    <circle r="92" fill="none" stroke="#174661" stroke-width="1" stroke-dasharray="3 9"/>
    <circle r="70" fill="none" stroke="#2A7799" stroke-opacity=".4" stroke-width="1"/>
    <circle r="45" fill="none" stroke="#16A4C4" stroke-opacity=".35" stroke-width="1.3"/>
    <circle r="88" fill="none" stroke="#32D2ED" stroke-width="2.4" stroke-dasharray="115 450" class="rotate" filter="url(#glow)"/>
    <circle r="67" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="55 370" class="rotate"/>
    <circle r="45" fill="#0B2039" opacity=".5"/>
    <circle r="29" fill="none" stroke="#3B82F6" stroke-width="1.5" class="pulse"/>
    <circle r="16" fill="none" stroke="#22D3EE" stroke-width="1.6" class="pulse2"/>
    <path d="M-17 0H17M0 -17V17" stroke="#6BE7F3" stroke-width="1.5"/>
    <circle r="3.6" fill="#A7F9FF" filter="url(#glow)"/>
  </g>
  <text x="750" y="93" font-size="12" fill="#57C8DC" letter-spacing="2">SYSTEM OVERVIEW</text>
  <text x="742" y="314" font-size="13" fill="#9FC0D8">BACKEND</text>
  <circle cx="833" cy="310" r="3.5" fill="#2EDCC4" class="signal"/>
  <text x="852" y="314" font-size="13" fill="#9FC0D8">MOBILE</text>
  <circle cx="929" cy="310" r="3.5" fill="#2EDCC4" class="signal"/>
  <text x="949" y="314" font-size="13" fill="#9FC0D8">ML/AI</text>
  <text x="742" y="344" font-size="11" fill="#587C9A" letter-spacing="1.3">FOCUS / ARCHITECTURE / AUTOMATION</text>
  <path d="M1051 70h23v23M1051 344h23v-23" fill="none" stroke="#2899B8" stroke-width="1.4"/>
</g>
</svg>
